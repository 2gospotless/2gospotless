
<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>2GoSpotless | Detail Garage</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background:
        linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
        url("assets/garage.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }


    /* =========================
       HEADER
    ========================= */

    .interactive-header {
      width: 100%;
      height: 90px;

      padding: 15px 40px;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;

      background: #000;
      color: #fff;

      border-bottom: 1px solid #222;
    }


    /* =========================
       LOGO
    ========================= */

    .logo-link {
      display: block;
      line-height: 0;
    }

    .logo {
      height: 50px;
      width: auto;
      display: block;

      transition: transform 0.2s ease;
    }

    .logo-link:hover .logo {
      transform: scale(1.05);
    }


    /* =========================
       BACK BUTTON
    ========================= */

    .back-button {
      position: absolute;
      left: 40px;

      color: #fff;
      text-decoration: none;

      font-size: 13px;
      font-weight: 700;

      letter-spacing: 1px;

      transition: 0.2s ease;
    }

    .back-button:hover {
      color: #ffd400;
    }


    /* =========================
       PAGE TITLE
    ========================= */

    .interactive-title {
      text-align: center;

      padding: 65px 20px 40px;
    }

    .interactive-title span {
      display: block;

      margin-bottom: 12px;

      color: #777;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 4px;
    }

    .interactive-title h1 {
      font-size: clamp(40px, 6vw, 70px);

      font-weight: 800;

      letter-spacing: -2px;

      color: #fff;
    }


    /* =========================
       MAIN EXPERIENCE
    ========================= */

    .experience {
      max-width: 1250px;

      margin: 0 auto;

      padding: 20px 25px 100px;

      display: grid;

      grid-template-columns: 1.5fr 0.7fr;

      gap: 35px;

      align-items: center;
    }


    /* =========================
       IMAGE
    ========================= */

    .image-container {
      position: relative;

      width: 100%;

      max-height: 78vh;

      min-height: 450px;

      display: flex;

      justify-content: center;

      align-items: center;

      overflow: hidden;

      background: #080808;

      border: 1px solid #292929;

      border-radius: 8px;
    }

    .image-container img {
      display: block;

      width: auto;

      height: auto;

      max-width: 100%;

      max-height: 78vh;

      object-fit: contain;

      opacity: 1;

      transition:
        opacity 0.3s ease,
        transform 0.4s ease;
    }

    .image-container.changing img {
      opacity: 0;
      transform: scale(0.98);
    }


    /* =========================
       IMAGE NUMBER
    ========================= */

    .image-number {
      position: absolute;

      bottom: 18px;
      right: 20px;

      color: #aaa;

      font-size: 11px;

      letter-spacing: 2px;
    }


    /* =========================
       GTA STYLE WHEEL AREA
    ========================= */

    .wheel-area {
      width: 100%;

      display: flex;

      justify-content: center;

      align-items: center;

      position: relative;
    }


    /* =========================
       WHEEL
    ========================= */

    .weapon-wheel {
      width: 360px;
      height: 360px;

      position: relative;

      display: flex;

      justify-content: center;
      align-items: center;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(25, 25, 25, 0.98) 0%,
          rgba(8, 8, 8, 0.98) 48%,
          rgba(0, 0, 0, 0.98) 72%
        );

      border: 2px solid #444;

      box-shadow:
        0 0 0 8px rgba(0, 0, 0, 0.45),
        0 20px 60px rgba(0, 0, 0, 0.75);

      transform: rotate(0deg);
    }


    /* =========================
       WHEEL INNER RING
    ========================= */

    .wheel-inner {
      position: absolute;

      width: 205px;
      height: 205px;

      border-radius: 50%;

      border: 1px solid #333;

      background: rgba(0, 0, 0, 0.35);

      pointer-events: none;
    }


    /* =========================
       WHEEL CENTER
    ========================= */

    .wheel-center {
      width: 120px;
      height: 120px;

      position: relative;
      z-index: 10;

      border-radius: 50%;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      background:
        radial-gradient(
          circle,
          #242424 0%,
          #0b0b0b 70%
        );

      border: 2px solid #444;

      box-shadow:
        inset 0 0 25px rgba(0, 0, 0, 0.8),
        0 0 25px rgba(0, 0, 0, 0.7);
    }

    .wheel-center-number {
      color: #ffd400;

      font-size: 30px;

      font-weight: 900;

      line-height: 1;
    }

    .wheel-center-text {
      margin-top: 7px;

      color: #aaa;

      font-size: 8px;

      font-weight: 700;

      letter-spacing: 2px;
    }


    /* =========================
       WHEEL OPTIONS
    ========================= */

    .wheel-option {
      position: absolute;

      width: 135px;
      height: 135px;

      display: flex;

      justify-content: center;
      align-items: center;

      border: 1px solid #333;

      background:
        linear-gradient(
          145deg,
          rgba(35, 35, 35, 0.95),
          rgba(10, 10, 10, 0.95)
        );

      color: #fff;

      cursor: pointer;

      clip-path: polygon(
        18% 0%,
        82% 0%,
        100% 18%,
        100% 82%,
        82% 100%,
        18% 100%,
        0% 82%,
        0% 18%
      );

      transition:
        background 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }


    /* TOP */

    .wheel-option:nth-child(1) {
      top: 12px;
      left: 50%;

      transform: translateX(-50%);
    }


    /* RIGHT */

    .wheel-option:nth-child(2) {
      right: 12px;
      top: 50%;

      transform: translateY(-50%);
    }


    /* BOTTOM */

    .wheel-option:nth-child(3) {
      bottom: 12px;
      left: 50%;

      transform: translateX(-50%);
    }


    /* =========================
       OPTION CONTENT
    ========================= */

    .wheel-option-content {
      text-align: center;

      width: 100%;
    }

    .wheel-option-number {
      display: block;

      margin-bottom: 8px;

      color: #666;

      font-size: 24px;

      font-weight: 900;
    }

    .wheel-option-name {
      display: block;

      padding: 0 8px;

      font-size: 11px;

      font-weight: 800;

      letter-spacing: 0.5px;

      line-height: 1.25;
    }


    /* =========================
       HOVER
    ========================= */

    .wheel-option:hover {
      background:
        linear-gradient(
          145deg,
          #252525,
          #111
        );

      border-color: #777;

      box-shadow:
        0 0 20px rgba(255, 212, 0, 0.15);
    }


    /* =========================
       ACTIVE OPTION
    ========================= */

    .wheel-option.active {
      background:
        linear-gradient(
          145deg,
          #333,
          #111
        );

      border-color: #ffd400;

      box-shadow:
        0 0 25px rgba(255, 212, 0, 0.28),
        inset 0 0 20px rgba(255, 212, 0, 0.06);
    }

    .wheel-option.active .wheel-option-number {
      color: #ffd400;
    }


    /* =========================
       WHEEL LABEL
    ========================= */

    .wheel-label {
      position: absolute;

      bottom: -45px;

      left: 50%;

      transform: translateX(-50%);

      width: 100%;

      text-align: center;

      color: #777;

      font-size: 9px;

      font-weight: 700;

      letter-spacing: 2px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 850px) {

      .interactive-header {
        height: 80px;

        padding: 15px 20px;
      }

      .logo {
        height: 45px;
      }

      .back-button {
        left: 20px;

        font-size: 11px;
      }

      .interactive-title {
        padding-top: 45px;
        padding-bottom: 25px;
      }

      .interactive-title h1 {
        font-size: 42px;
      }

      .experience {
        grid-template-columns: 1fr;

        padding: 15px 20px 80px;

        gap: 55px;
      }

      .image-container {
        min-height: 300px;

        max-height: 65vh;
      }

      .image-container img {
        max-height: 65vh;
      }

      .wheel-area {
        padding-bottom: 45px;
      }

      .weapon-wheel {
        width: 300px;
        height: 300px;
      }

      .wheel-inner {
        width: 170px;
        height: 170px;
      }

      .wheel-center {
        width: 100px;
        height: 100px;
      }

      .wheel-center-number {
        font-size: 25px;
      }

      .wheel-option {
        width: 112px;
        height: 112px;
      }

      .wheel-option-number {
        font-size: 20px;
      }

      .wheel-option-name {
        font-size: 9px;
      }

      .wheel-option:nth-child(1) {
        top: 8px;
      }

      .wheel-option:nth-child(2) {
        right: 8px;
      }

      .wheel-option:nth-child(3) {
        bottom: 8px;
      }

    }


    /* =========================
       SMALL PHONES
    ========================= */

    @media (max-width: 450px) {

      .interactive-header {
        height: 75px;
      }

      .logo {
        height: 40px;
      }

      .back-button {
        font-size: 9px;
        left: 15px;
      }

      .interactive-title h1 {
        font-size: 34px;
      }

      .weapon-wheel {
        width: 270px;
        height: 270px;
      }

      .wheel-inner {
        width: 150px;
        height: 150px;
      }

      .wheel-center {
        width: 88px;
        height: 88px;
      }

      .wheel-option {
        width: 100px;
        height: 100px;
      }

      .wheel-option-name {
        font-size: 8px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header class="interactive-header">

    <!-- BACK TO MAIN PAGE -->

    <a href="index.html" class="back-button">
      ← BACK TO MAIN PAGE
    </a>


    <!-- CENTER LOGO -->

    <a href="index.html" class="logo-link">

      <img
        src="./assets/logo.png"
        alt="2GoSpotless"
        class="logo"
      >

    </a>

  </header>


  <!-- =========================
       PAGE TITLE
  ========================= -->

  <section class="interactive-title">

    <span>
      2GOSPOTLESS GARAGE
    </span>

    <h1>
      Highlighted Visuals
    </h1>

  </section>


  <!-- =========================
       MAIN EXPERIENCE
  ========================= -->

  <main class="experience">


    <!-- =========================
         IMAGE
    ========================= -->

    <div
      class="image-container"
      id="imageContainer"
    >

      <img
        id="packageImage"
        src="assets/bronze.jpg"
        alt="2GoSpotless Bronze Package"
      >

      <div
        class="image-number"
        id="imageNumber"
      >
        01 / 03
      </div>

    </div>


    <!-- =========================
         GTA STYLE WHEEL
    ========================= -->

    <div class="wheel-area">

      <div class="weapon-wheel">


        <!-- INNER RING -->

        <div class="wheel-inner"></div>


        <!-- =====================
             BRONZE
        ====================== -->

        <button
          class="wheel-option active"
          data-image="assets/bronze.jpg"
          data-number="01 / 03"
          data-name="BRONZE PACKAGE"
        >

          <div class="wheel-option-content">

            <span class="wheel-option-number">
              01
            </span>

            <span class="wheel-option-name">
              BRONZE<br>
              PACKAGE
            </span>

          </div>

        </button>


        <!-- =====================
             SILVER
        ====================== -->

        <button
          class="wheel-option"
          data-image="assets/silver.jpg"
          data-number="02 / 03"
          data-name="SILVER PACKAGE"
        >

          <div class="wheel-option-content">

            <span class="wheel-option-number">
              02
            </span>

            <span class="wheel-option-name">
              SILVER<br>
              PACKAGE
            </span>

          </div>

        </button>


        <!-- =====================
             PRESIDENTIAL
        ====================== -->

        <button
          class="wheel-option"
          data-image="assets/presidential.jpg"
          data-number="03 / 03"
          data-name="PRESIDENTIAL PACKAGE"
        >

          <div class="wheel-option-content">

            <span class="wheel-option-number">
              03
            </span>

            <span class="wheel-option-name">
              PRESIDENTIAL<br>
              PACKAGE
            </span>

          </div>

        </button>


        <!-- =====================
             CENTER
        ====================== -->

        <div class="wheel-center">

          <div
            class="wheel-center-number"
            id="wheelCenterNumber"
          >
            01
          </div>

          <div
            class="wheel-center-text"
            id="wheelCenterText"
          >
            BRONZE
          </div>

        </div>


        <!-- WHEEL LABEL -->

        <div class="wheel-label">
          SELECT PACKAGE
        </div>


      </div>

    </div>


  </main>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    const buttons =
      document.querySelectorAll(".wheel-option");

    const image =
      document.getElementById("packageImage");

    const imageContainer =
      document.getElementById("imageContainer");

    const imageNumber =
      document.getElementById("imageNumber");

    const wheelCenterNumber =
      document.getElementById("wheelCenterNumber");

    const wheelCenterText =
      document.getElementById("wheelCenterText");


    /* =========================
       PACKAGE SELECTION
    ========================= */

    buttons.forEach(button => {

      button.addEventListener("click", function() {


        /* Remove active state */

        buttons.forEach(item => {
          item.classList.remove("active");
        });


        /* Activate selected option */

        this.classList.add("active");


        /* Get information */

        const newImage =
          this.getAttribute("data-image");

        const newNumber =
          this.getAttribute("data-number");

        const newName =
          this.getAttribute("data-name");


        /* Update center */

        wheelCenterNumber.textContent =
          newNumber.substring(0, 2);

        wheelCenterText.textContent =
          newName.replace(" PACKAGE", "");


        /* Fade image */

        imageContainer.classList.add("changing");


        setTimeout(() => {

          image.src = newImage;

          image.alt =
            "2GoSpotless " + newName;


          imageNumber.textContent =
            newNumber;


          image.onload = () => {

            imageContainer.classList.remove("changing");

          };

        }, 180);

      });

    });

  </script>


</body>
</html>
```
