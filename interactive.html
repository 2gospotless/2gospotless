
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>2GoSpotless | Detail Garage</title>

<style>
:root {
--gold: #ffd400;
--gold-soft: rgba(255, 212, 0, 0.2);
--gold-glow: rgba(255, 212, 0, 0.34);
--black: #050505;
--charcoal: #111111;
--panel: rgba(10, 10, 10, 0.84);
--line: rgba(255, 255, 255, 0.22);
--muted: rgba(255, 255, 255, 0.62);
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

html {
min-height: 100%;
background: var(--black);
}

body {
min-height: 100vh;
color: #ffffff;
font-family: Arial, Helvetica, sans-serif;
background:
linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
url("assets/garage.jpg");
background-size: cover;
background-position: center;
background-attachment: fixed;
overflow-x: hidden;
}

button,
a {
font: inherit;
}

/* HEADER */

.site-header {
position: relative;
z-index: 10;
display: flex;
align-items: center;
justify-content: center;
min-height: 82px;
padding: 14px 24px;
background: rgba(0, 0, 0, 0.94);
border-bottom: 1px solid rgba(255, 255, 255, 0.12);
}

.logo {
display: block;
width: auto;
height: 50px;
object-fit: contain;
}

.back-link {
position: absolute;
left: 24px;
top: 50%;
display: inline-flex;
align-items: center;
min-height: 38px;
padding: 0 14px;
color: rgba(255, 255, 255, 0.82);
border: 1px solid rgba(255, 255, 255, 0.34);
background: rgba(0, 0, 0, 0.38);
text-decoration: none;
font-size: 0.72rem;
font-weight: 700;
letter-spacing: 0.13em;
transform: translateY(-50%);
transition: color 180ms ease, border-color 180ms ease, background 180ms ease;
}

.back-link:hover,
.back-link:focus-visible {
color: var(--gold);
border-color: var(--gold);
background: rgba(255, 212, 0, 0.08);
outline: none;
}

/* MAIN LAYOUT */

main {
width: min(1180px, calc(100% - 40px));
margin: 0 auto;
padding: 58px 0 72px;
}

.page-heading {
margin-bottom: 34px;
text-align: center;
}

.eyebrow {
margin-bottom: 9px;
color: var(--gold);
font-size: 0.7rem;
font-weight: 700;
letter-spacing: 0.34em;
}

h1 {
color: #ffffff;
font-size: clamp(2rem, 5vw, 3.8rem);
font-weight: 800;
letter-spacing: 0.12em;
line-height: 1;
text-shadow: 0 3px 18px rgba(0, 0, 0, 0.65);
}

.subtitle {
margin-top: 13px;
color: rgba(255, 255, 255, 0.68);
font-size: 0.78rem;
letter-spacing: 0.3em;
text-transform: uppercase;
}

.garage-layout {
display: grid;
grid-template-columns: minmax(0, 1.25fr) minmax(420px, 0.9fr);
align-items: center;
gap: 30px;
width: 100%;
margin: 0 auto;
}

/* IMAGE PANEL */

.image-panel {
position: relative;
display: flex;
align-items: center;
justify-content: center;
min-height: 510px;
padding: 22px;
overflow: hidden;
background: rgba(4, 4, 4, 0.78);
border: 1px solid rgba(255, 255, 255, 0.24);
box-shadow: 0 20px 55px rgba(0, 0, 0, 0.5);
}

.image-panel::before,
.image-panel::after {
position: absolute;
width: 54px;
height: 54px;
content: "";
pointer-events: none;
}

.image-panel::before {
top: 11px;
left: 11px;
border-top: 1px solid var(--gold);
border-left: 1px solid var(--gold);
}

.image-panel::after {
right: 11px;
bottom: 11px;
border-right: 1px solid var(--gold);
border-bottom: 1px solid var(--gold);
}

.package-image {
display: block;
width: 100%;
height: 465px;
object-fit: contain;
opacity: 1;
transition: opacity 320ms ease;
}

.package-image.is-changing {
opacity: 0;
}

.image-label {
position: absolute;
right: 28px;
bottom: 25px;
color: rgba(255, 255, 255, 0.58);
font-size: 0.65rem;
letter-spacing: 0.2em;
text-transform: uppercase;
}

/* WHEEL AREA */

.wheel-area {
display: flex;
align-items: center;
justify-content: center;
min-width: 0;
}

.wheel {
position: relative;
width: min(520px, 100%);
aspect-ratio: 1;
filter: drop-shadow(0 20px 28px rgba(0, 0, 0, 0.5));
}

.wheel::before {
position: absolute;
inset: 2%;
border: 1px solid rgba(255, 255, 255, 0.27);
border-radius: 50%;
background:
radial-gradient(circle, transparent 0 28%, rgba(255, 255, 255, 0.05) 28.2% 28.6%, transparent 28.9%),
conic-gradient(
from 245deg,
rgba(255, 255, 255, 0.07),
rgba(255, 255, 255, 0.015) 24%,
rgba(255, 255, 255, 0.07) 25%,
rgba(255, 255, 255, 0.015) 58%,
rgba(255, 255, 255, 0.07) 59%,
rgba(255, 255, 255, 0.015)
),
rgba(5, 5, 5, 0.78);
box-shadow:
inset 0 0 45px rgba(0, 0, 0, 0.95),
0 0 0 10px rgba(0, 0, 0, 0.2);
content: "";
}

.wheel::after {
position: absolute;
inset: 14%;
border: 1px solid rgba(255, 255, 255, 0.1);
border-radius: 50%;
content: "";
pointer-events: none;
}

/* PACKAGE SLICES – CLIPPED TO WHEEL EDGE */

.package-option {
position: absolute;
z-index: 2;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
width: 54%;
height: 29%;
padding: 16px 20px;
color: rgba(255, 255, 255, 0.66);
cursor: pointer;
border: 1px solid rgba(255, 255, 255, 0.32);
background:
linear-gradient(145deg, rgba(39, 39, 39, 0.88), rgba(7, 7, 7, 0.95));
/* This clip-path makes the inner edge curved to match the wheel. */
clip-path: polygon(
23% 0,
100% 0,
100% 100%,
0 100%,
0 38%,
18% 30%
);
transition:
color 200ms ease,
border-color 200ms ease,
background 200ms ease,
filter 200ms ease,
transform 200ms ease;
}

.package-option:hover,
.package-option:focus-visible {
color: #ffffff;
background: linear-gradient(145deg, rgba(67, 67, 67, 0.95), rgba(12, 12, 12, 0.98));
filter: brightness(1.15);
outline: none;
}

.package-option.is-active {
z-index: 4;
color: var(--gold);
border-color: var(--gold);
background:
linear-gradient(145deg, rgba(86, 72, 0, 0.52), rgba(12, 12, 8, 0.96));
filter: drop-shadow(0 0 8px var(--gold-glow));
}

.package-option.is-active::after {
position: absolute;
inset: 4px;
border: 1px solid rgba(255, 212, 0, 0.52);
clip-path: inherit;
content: "";
pointer-events: none;
}

/* Positions relative to wheel so they "hug" it */

.bronze-option {
left: -3%;
top: 38%;
transform: rotate(-6deg);
}

.silver-option {
right: -2%;
top: 10%;
transform: rotate(8deg);
}

.presidential-option {
right: -2%;
bottom: 9%;
transform: rotate(-8deg);
}

.package-option:hover {
transform: translateY(-3px) rotate(-6deg);
}

.silver-option:hover {
transform: translateY(-3px) rotate(8deg);
}

.presidential-option:hover {
transform: translateY(-3px) rotate(-8deg);
}

.package-number {
margin-bottom: 7px;
color: rgba(255, 255, 255, 0.43);
font-size: 0.64rem;
letter-spacing: 0.18em;
}

.package-option.is-active .package-number {
color: rgba(255, 212, 0, 0.72);
}

.package-name {
font-size: clamp(0.75rem, 1.5vw, 0.96rem);
font-weight: 800;
letter-spacing: 0.14em;
text-align: center;
}

.package-caption {
margin-top: 7px;
color: rgba(255, 255, 255, 0.44);
font-size: 0.56rem;
letter-spacing: 0.12em;
text-transform: uppercase;
}

/* CENTER OF WHEEL */

.center-display {
position: absolute;
z-index: 5;
top: 50%;
left: 50%;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
width: 32%;
aspect-ratio: 1;
padding: 15px;
text-align: center;
border: 1px solid rgba(255, 212, 0, 0.68);
border-radius: 50%;
background:
radial-gradient(circle, rgba(54, 45, 0, 0.5), rgba(7, 7, 7, 0.97) 67%);
box-shadow:
inset 0 0 25px rgba(255, 212, 0, 0.13),
0 0 22px rgba(255, 212, 0, 0.2);
transform: translate(-50%, -50%);
}

.center-display::before {
position: absolute;
inset: 8px;
border: 1px solid rgba(255, 255, 255, 0.15);
border-radius: 50%;
content: "";
}

.center-label {
position: relative;
z-index: 1;
color: rgba(255, 255, 255, 0.5);
font-size: clamp(0.38rem, 1vw, 0.52rem);
font-weight: 700;
letter-spacing: 0.11em;
line-height: 1.25;
}

.selected-name {
position: relative;
z-index: 1;
max-width: 100%;
margin-top: 8px;
color: var(--gold);
font-size: clamp(0.72rem, 1.7vw, 1rem);
font-weight: 800;
letter-spacing: 0.1em;
line-height: 1.1;
overflow-wrap: anywhere;
}

.selected-number {
position: relative;
z-index: 1;
margin-top: 7px;
color: rgba(255, 255, 255, 0.42);
font-size: 0.58rem;
letter-spacing: 0.2em;
}

/* RESPONSIVE */

@media (max-width: 900px) {
main {
width: min(680px, calc(100% - 32px));
padding-top: 42px;
}

.garage-layout {
grid-template-columns: 1fr;
gap: 26px;
}

.image-panel {
min-height: 430px;
}

.package-image {
height: 390px;
}

.wheel-area {
width: min(500px, 100%);
margin: 0 auto;
}

.wheel {
width: min(460px, 100%);
}
}

@media (max-width: 560px) {
.site-header {
min-height: 76px;
padding: 14px 12px;
}

.logo {
height: 43px;
max-width: 145px;
}

.back-link {
left: 10px;
min-height: 32px;
padding: 0 8px;
font-size: 0.57rem;
letter-spacing: 0.08em;
}

main {
width: calc(100% - 22px);
padding: 34px 0 46px;
}

.page-heading {
margin-bottom: 24px;
}

h1 {
font-size: clamp(1.55rem, 8vw, 2.3rem);
letter-spacing: 0.08em;
}

.subtitle {
margin-top: 10px;
font-size: 0.62rem;
letter-spacing: 0.2em;
}

.image-panel {
min-height: 285px;
padding: 12px;
}

.package-image {
height: 255px;
}

.image-label {
right: 17px;
bottom: 14px;
font-size: 0.52rem;
}

.wheel-area {
width: 100%;
}

.wheel {
width: min(100%, 420px);
}

.package-option {
padding: 10px 12px;
}

.package-number {
margin-bottom: 4px;
font-size: 0.49rem;
}

.package-name {
font-size: clamp(0.57rem, 2.5vw, 0.75rem);
letter-spacing: 0.09em;
}

.package-caption {
margin-top: 4px;
font-size: 0.42rem;
}

.center-label {
max-width: 78px;
font-size: 0.37rem;
}

.selected-name {
margin-top: 5px;
font-size: clamp(0.6rem, 2.5vw, 0.8rem);
}

.selected-number {
margin-top: 4px;
font-size: 0.46rem;
}
}

@media (prefers-reduced-motion: reduce) {
*,
*::before,
*::after {
scroll-behavior: auto !important;
transition-duration: 0.01ms !important;
}
}
</style>
</head>

<body>
<header class="site-header">
<a class="back-link" href="index.html" aria-label="Back to main page">
← BACK TO MAIN PAGE
</a>

<a href="index.html" aria-label="2GoSpotless home">
<img class="logo" src="./assets/logo.png" alt="2GoSpotless logo">
</a>
</header>

<main>
<section class="page-heading" aria-labelledby="garage-title">
<p class="eyebrow">2GOSPOTLESS DETAILING</p>
<h1 id="garage-title">2GOSPOTLESS GARAGE</h1>
<p class="subtitle">Highlighted Visuals</p>
</section>

<section class="garage-layout" aria-label="Detailing package selector">
<div class="image-panel">
<img
id="package-image"
class="package-image"
src="assets/bronze.jpg"
alt="Bronze detailing package"
>
<span class="image-label">Vehicle detailing selection</span>
</div>

<div class="wheel-area">
<div class="wheel" role="group" aria-label="Choose a detailing package">
<!-- BRONZE (LEFT SLICE) -->
<button
class="package-option bronze-option is-active"
type="button"
data-package="BRONZE"
data-number="01"
data-image="assets/bronze.jpg"
data-alt="Bronze detailing package"
aria-pressed="true"
>
<span class="package-number">01</span>
<span class="package-name">BRONZE</span>
<span class="package-caption">Essential finish</span>
</button>

<!-- SILVER (UPPER-RIGHT SLICE) -->
<button
class="package-option silver-option"
type="button"
data-package="SILVER"
data-number="02"
data-image="assets/silver.jpg"
data-alt="Silver detailing package"
aria-pressed="false"
>
<span class="package-number">02</span>
<span class="package-name">SILVER</span>
<span class="package-caption">Enhanced finish</span>
</button>

<!-- PRESIDENTIAL (LOWER-RIGHT SLICE) -->
<button
class="package-option presidential-option"
type="button"
data-package="PRESIDENTIAL"
data-number="03"
data-image="assets/presidential.jpg"
data-alt="Presidential detailing package"
aria-pressed="false"
>
<span class="package-number">03</span>
<span class="package-name">PRESIDENTIAL</span>
<span class="package-caption">Luxury finish</span>
</button>

<!-- CENTER OF WHEEL -->
<div class="center-display" aria-live="polite">
<span class="center-label">CURRENTLY SELECTED</span>
<span id="selected-name" class="selected-name">BRONZE</span>
<span id="selected-number" class="selected-number">01</span>
</div>
</div>
</div>
</section>
</main>

<script>
document.addEventListener("DOMContentLoaded", () => {
const image = document.getElementById("package-image");
const selectedName = document.getElementById("selected-name");
const selectedNumber = document.getElementById("selected-number");
const packageOptions = document.querySelectorAll(".package-option");

function selectPackage(option) {
const packageName = option.dataset.package;
const packageNumber = option.dataset.number;
const imagePath = option.dataset.image;
const imageAlt = option.dataset.alt;

// Update active state
packageOptions.forEach((item) => {
const isSelected = item === option;
item.classList.toggle("is-active", isSelected);
item.setAttribute("aria-pressed", String(isSelected));
});

// Update center text
selectedName.textContent = packageName;
selectedNumber.textContent = packageNumber;

// Fade transition
image.classList.add("is-changing");

window.setTimeout(() => {
image.src = imagePath;
image.alt = imageAlt;

image.addEventListener(
"load",
() => {
image.classList.remove("is-changing");
},
{ once: true }
);

if (image.complete) {
image.classList.remove("is-changing");
}
}, 180);
}

packageOptions.forEach((option) => {
option.addEventListener("click", () => {
selectPackage(option);
});

option.addEventListener("keydown", (event) => {
if (event.key === "Enter" || event.key === " ") {
event.preventDefault();
selectPackage(option);
}
});
});
});
</script>
</body>
</html>
