<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">

<title>2GoSpotless | Detail Garage</title>

<style>

/* =========================================================
   2GOSPOTLESS DETAIL GARAGE
   GTA / LOS SANTOS CUSTOMS INSPIRED MENU
   ========================================================= */

:root {
  --yellow: #ffd400;
  --yellow-soft: rgba(255, 212, 0, 0.16);
  --yellow-glow: rgba(255, 212, 0, 0.32);

  --black: #050505;
  --panel: rgba(8, 8, 8, 0.92);

  --white: #ffffff;
  --text: rgba(255, 255, 255, 0.78);
  --muted: rgba(255, 255, 255, 0.45);

  --line: rgba(255, 255, 255, 0.14);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  min-height: 100%;
  background: var(--black);
}

body {
  min-height: 100vh;

  color: #fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      rgba(0, 0, 0, 0.57),
      rgba(0, 0, 0, 0.57)
    ),
    url("assets/garage.jpg");

  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  overflow-x: hidden;
}


/* =========================================================
   HEADER
   ========================================================= */

.site-header {
  position: relative;
  z-index: 20;

  display: flex;
  align-items: center;
  justify-content: center;

  min-height: 82px;

  padding: 14px 24px;

  background: rgba(0, 0, 0, 0.94);

  border-bottom:
    1px solid rgba(255, 255, 255, 0.12);
}

.logo {
  display: block;

  height: 50px;
  width: auto;

  object-fit: contain;
}

.back-link {
  position: absolute;

  left: 24px;
  top: 50%;

  display: inline-flex;
  align-items: center;

  min-height: 38px;

  padding: 0 14px;

  color: rgba(255, 255, 255, 0.84);

  border:
    1px solid rgba(255, 255, 255, 0.28);

  background: rgba(0, 0, 0, 0.38);

  text-decoration: none;

  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.13em;

  transform: translateY(-50%);

  transition:
    color 180ms ease,
    border-color 180ms ease,
    background 180ms ease;
}

.back-link:hover,
.back-link:focus-visible {
  color: var(--yellow);

  border-color: var(--yellow);

  background:
    rgba(255, 212, 0, 0.08);

  outline: none;
}


/* =========================================================
   MAIN
   ========================================================= */

main {
  width: min(1250px, calc(100% - 40px));

  margin: 0 auto;

  padding: 48px 0 70px;
}

.page-heading {
  margin-bottom: 28px;

  text-align: center;
}

.eyebrow {
  margin-bottom: 9px;

  color: var(--yellow);

  font-size: 0.7rem;
  font-weight: 700;

  letter-spacing: 0.34em;
}

h1 {
  color: #fff;

  font-size:
    clamp(2rem, 5vw, 3.8rem);

  font-weight: 800;

  letter-spacing: 0.12em;

  line-height: 1;

  text-shadow:
    0 3px 18px rgba(0, 0, 0, 0.65);
}

.subtitle {
  margin-top: 13px;

  color:
    rgba(255, 255, 255, 0.68);

  font-size: 0.78rem;

  letter-spacing: 0.3em;

  text-transform: uppercase;
}


/* =========================================================
   MAIN GARAGE AREA
   ========================================================= */

.garage-layout {

  display: grid;

  grid-template-columns:
    minmax(0, 1.45fr)
    minmax(350px, 0.65fr);

  align-items: center;

  gap: 34px;

  width: 100%;
}


/* =========================================================
   IMAGE
   ========================================================= */

.image-panel {

  position: relative;

  display: flex;

  align-items: center;
  justify-content: center;

  min-height: 540px;

  padding: 22px;

  overflow: hidden;

  background:
    rgba(4, 4, 4, 0.74);

  border:
    1px solid rgba(255, 255, 255, 0.20);

  box-shadow:
    0 20px 55px rgba(0, 0, 0, 0.55);
}

.image-panel::before,
.image-panel::after {

  position: absolute;

  width: 54px;
  height: 54px;

  content: "";

  pointer-events: none;
}

.image-panel::before {

  top: 11px;
  left: 11px;

  border-top:
    1px solid var(--yellow);

  border-left:
    1px solid var(--yellow);
}

.image-panel::after {

  right: 11px;
  bottom: 11px;

  border-right:
    1px solid var(--yellow);

  border-bottom:
    1px solid var(--yellow);
}

.package-image {

  display: block;

  width: 100%;
  height: 500px;

  object-fit: contain;

  opacity: 1;

  transition:
    opacity 260ms ease,
    transform 260ms ease;
}

.package-image.is-changing {
  opacity: 0;
  transform: scale(0.985);
}

.image-label {

  position: absolute;

  right: 28px;
  bottom: 25px;

  color:
    rgba(255, 255, 255, 0.48);

  font-size: 0.65rem;

  letter-spacing: 0.2em;

  text-transform: uppercase;
}


/* =========================================================
   GTA STYLE MENU
   ========================================================= */

.menu-area {

  display: flex;

  align-items: center;
  justify-content: center;

  min-width: 0;
}


/* Main menu box */

.gta-menu {

  position: relative;

  width: 100%;
  max-width: 470px;

  background:
    linear-gradient(
      90deg,
      rgba(8, 8, 8, 0.97),
      rgba(16, 16, 16, 0.94)
    );

  border:
    1px solid rgba(255, 255, 255, 0.16);

  box-shadow:
    0 25px 60px rgba(0, 0, 0, 0.65);

  overflow: hidden;
}


/* Yellow top edge */

.gta-menu::before {

  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 3px;

  background:
    var(--yellow);

  content: "";
}


/* =========================================================
   MENU HEADER
   ========================================================= */

.menu-header {

  position: relative;

  min-height: 86px;

  padding:
    17px 22px 15px 86px;

  border-bottom:
    1px solid var(--line);

  background:
    rgba(255, 255, 255, 0.025);
}


/* Small company logo */

.menu-logo {

  position: absolute;

  left: 20px;
  top: 50%;

  width: 50px;
  height: 50px;

  object-fit: contain;

  transform:
    translateY(-50%);

  filter:
    drop-shadow(
      0 3px 8px
      rgba(0, 0, 0, 0.5)
    );
}


/* Menu title */

.menu-title {

  color: #fff;

  font-size: 0.95rem;

  font-weight: 800;

  letter-spacing: 0.16em;

  text-transform: uppercase;
}

.menu-subtitle {

  margin-top: 6px;

  color:
    rgba(255, 255, 255, 0.43);

  font-size: 0.58rem;

  font-weight: 700;

  letter-spacing: 0.18em;

  text-transform: uppercase;
}


/* =========================================================
   MENU OPTIONS
   ========================================================= */

.menu-options {

  padding: 10px 0;
}

.menu-option {

  position: relative;

  display: grid;

  grid-template-columns:
    58px
    1fr
    38px;

  align-items: center;

  width: 100%;

  min-height: 72px;

  padding: 0 18px 0 0;

  color:
    rgba(255, 255, 255, 0.72);

  background:
    transparent;

  border: none;

  border-bottom:
    1px solid rgba(255, 255, 255, 0.08);

  cursor: pointer;

  text-align: left;

  transition:
    background 160ms ease,
    color 160ms ease,
    padding 160ms ease;
}

.menu-option:last-child {
  border-bottom: none;
}


/* Number */

.menu-number {

  display: flex;

  align-items: center;
  justify-content: center;

  height: 100%;

  color:
    rgba(255, 255, 255, 0.40);

  font-size: 0.68rem;

  font-weight: 800;

  letter-spacing: 0.08em;
}


/* Service text */

.menu-service {

  display: flex;

  flex-direction: column;

  justify-content: center;

  gap: 4px;

  min-width: 0;
}

.service-name {

  color: inherit;

  font-size:
    clamp(0.76rem, 1.4vw, 0.92rem);

  font-weight: 800;

  letter-spacing: 0.10em;

  line-height: 1.15;

  white-space: nowrap;
}

.service-tier {

  color:
    rgba(255, 255, 255, 0.35);

  font-size: 0.53rem;

  font-weight: 700;

  letter-spacing: 0.13em;

  text-transform: uppercase;
}


/* Arrow */

.menu-arrow {

  color:
    rgba(255, 255, 255, 0.25);

  font-size: 1.1rem;

  text-align: right;

  transition:
    color 160ms ease,
    transform 160ms ease;
}


/* =========================================================
   HOVER
   ========================================================= */

.menu-option:hover {

  color: #fff;

  background:
    rgba(255, 255, 255, 0.055);

  padding-left: 5px;
}

.menu-option:hover .menu-arrow {

  color: var(--yellow);

  transform: translateX(3px);
}


/* =========================================================
   ACTIVE GTA STYLE
   ========================================================= */

.menu-option.is-active {

  color: #111;

  background:
    var(--yellow);

  box-shadow:
    inset 5px 0 0 #fff;

  padding-left: 5px;
}

.menu-option.is-active .menu-number {

  color:
    rgba(0, 0, 0, 0.55);
}

.menu-option.is-active .service-tier {

  color:
    rgba(0, 0, 0, 0.55);
}

.menu-option.is-active .menu-arrow {

  color: #111;

  transform:
    translateX(2px);
}


/* =========================================================
   CURRENTLY SELECTED
   ========================================================= */

.current-selection {

  padding:
    17px 22px 20px;

  border-top:
    1px solid rgba(255, 255, 255, 0.13);

  background:
    rgba(0, 0, 0, 0.35);
}

.current-label {

  color:
    rgba(255, 255, 255, 0.38);

  font-size: 0.52rem;

  font-weight: 700;

  letter-spacing: 0.18em;

  text-transform: uppercase;
}

.current-value {

  margin-top: 7px;

  color: var(--yellow);

  font-size: 0.8rem;

  font-weight: 800;

  letter-spacing: 0.11em;

  text-transform: uppercase;
}


/* =========================================================
   MENU FOOTER
   ========================================================= */

.menu-footer {

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding:
    11px 18px;

  border-top:
    1px solid rgba(255, 255, 255, 0.08);

  color:
    rgba(255, 255, 255, 0.28);

  font-size: 0.48rem;

  font-weight: 700;

  letter-spacing: 0.14em;

  text-transform: uppercase;
}

.menu-footer span:last-child {

  color:
    rgba(255, 212, 0, 0.48);
}


/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 900px) {

  main {

    width:
      min(700px, calc(100% - 32px));

    padding-top: 40px;
  }

  .garage-layout {

    grid-template-columns: 1fr;

    gap: 26px;
  }

  .image-panel {

    min-height: 430px;
  }

  .package-image {

    height: 390px;
  }

  .gta-menu {

    max-width: 600px;
  }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 560px) {

  .site-header {

    min-height: 76px;

    padding:
      14px 12px;
  }

  .logo {

    height: 43px;

    max-width: 145px;
  }

  .back-link {

    left: 10px;

    min-height: 32px;

    padding:
      0 8px;

    font-size: 0.57rem;

    letter-spacing: 0.08em;
  }

  main {

    width:
      calc(100% - 22px);

    padding:
      34px 0 46px;
  }

  .page-heading {

    margin-bottom: 22px;
  }

  h1 {

    font-size:
      clamp(1.55rem, 8vw, 2.3rem);

    letter-spacing: 0.08em;
  }

  .subtitle {

    margin-top: 10px;

    font-size: 0.58rem;

    letter-spacing: 0.16em;
  }

  .image-panel {

    min-height: 285px;

    padding: 12px;
  }

  .package-image {

    height: 255px;
  }

  .image-label {

    right: 17px;
    bottom: 14px;

    font-size: 0.48rem;
  }

  .gta-menu {

    width: 100%;
  }

  .menu-header {

    min-height: 76px;

    padding:
      14px 15px 13px 72px;
  }

  .menu-logo {

    left: 16px;

    width: 43px;
    height: 43px;
  }

  .menu-title {

    font-size: 0.75rem;

    letter-spacing: 0.13em;
  }

  .menu-subtitle {

    font-size: 0.48rem;

    letter-spacing: 0.13em;
  }

  .menu-option {

    grid-template-columns:
      49px
      1fr
      28px;

    min-height: 67px;

    padding-right: 13px;
  }

  .menu-number {

    font-size: 0.59rem;
  }

  .service-name {

    font-size: 0.69rem;

    letter-spacing: 0.07em;
  }

  .service-tier {

    font-size: 0.46rem;

    letter-spacing: 0.09em;
  }

  .current-selection {

    padding:
      14px 16px 16px;
  }

  .current-value {

    font-size: 0.67rem;
  }

  .menu-footer {

    padding:
      10px 14px;

    font-size: 0.42rem;
  }
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {

    transition-duration:
      0.01ms !important;
  }
}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<header class="site-header">

  <a
    class="back-link"
    href="index.html"
    aria-label="Back to main page"
  >
    ← BACK TO MAIN PAGE
  </a>

  <a
    href="index.html"
    aria-label="2GoSpotless home"
  >
    <img
      class="logo"
      src="./assets/logo.png"
      alt="2GoSpotless logo"
    >
  </a>

</header>


<!-- =====================================================
     MAIN
     ===================================================== -->

<main>


  <!-- PAGE TITLE -->

  <section
    class="page-heading"
    aria-labelledby="garage-title"
  >

    <p class="eyebrow">
      2GOSPOTLESS GARAGE
    </p>

    <h1 id="garage-title">
      HIGHLIGHTED VISUALS
    </h1>

    <p class="subtitle">
      SEE WHAT YOUR PACKAGE GETS SHAMPOO'D
    </p>

  </section>


  <!-- ===================================================
       GARAGE
       =================================================== -->

  <section
    class="garage-layout"
    aria-label="Detailing package selector"
  >


    <!-- ================================================
         CAR IMAGE
         ================================================ -->

    <div class="image-panel">

      <img
        id="package-image"
        class="package-image"
        src="assets/bronze.jpg"
        alt="In and Out Bronze detailing package"
      >

      <span class="image-label">
        Vehicle detailing selection
      </span>

    </div>


    <!-- ================================================
         GTA STYLE MENU
         ================================================ -->

    <div class="menu-area">

      <div
        class="gta-menu"
        role="group"
        aria-label="Choose a detailing package"
      >


        <!-- MENU HEADER -->

        <div class="menu-header">

          <img
            class="menu-logo"
            src="./assets/logo.png"
            alt="2GoSpotless"
          >

          <div class="menu-title">
            DETAIL GARAGE
          </div>

          <div class="menu-subtitle">
            SELECT YOUR DETAILING PACKAGE
          </div>

        </div>


        <!-- MENU OPTIONS -->

        <div class="menu-options">


          <!-- 01 -->

          <button
            class="menu-option is-active"
            type="button"

            data-package="IN/OUT [BRONZE]"
            data-number="01"

            data-image="assets/bronze.jpg"

            data-alt="In and Out Bronze detailing package"

            aria-pressed="true"
          >

            <span class="menu-number">
              01
            </span>

            <span class="menu-service">

              <span class="service-name">
                IN/OUT [BRONZE]
              </span>

              <span class="service-tier">
                Essential finish
              </span>

            </span>

            <span class="menu-arrow">
              ›
            </span>

          </button>


          <!-- 02 -->

          <button
            class="menu-option"
            type="button"

            data-package="PARTIAL SHAMPOO [SILVER]"
            data-number="02"

            data-image="assets/silver.jpg"

            data-alt="Partial Shampoo Silver detailing package"

            aria-pressed="false"
          >

            <span class="menu-number">
              02
            </span>

            <span class="menu-service">

              <span class="service-name">
                PARTIAL SHAMPOO [SILVER]
              </span>

              <span class="service-tier">
                Enhanced finish
              </span>

            </span>

            <span class="menu-arrow">
              ›
            </span>

          </button>


          <!-- 03 -->

          <button
            class="menu-option"
            type="button"

            data-package="FULL SHAMPOO [PRESIDENTIAL]"
            data-number="03"

            data-image="assets/presidential.jpg"

            data-alt="Full Shampoo Presidential detailing package"

            aria-pressed="false"
          >

            <span class="menu-number">
              03
            </span>

            <span class="menu-service">

              <span class="service-name">
                FULL SHAMPOO [PRESIDENTIAL]
              </span>

              <span class="service-tier">
                Luxury finish
              </span>

            </span>

            <span class="menu-arrow">
              ›
            </span>

          </button>


        </div>


        <!-- CURRENTLY SELECTED -->

        <div class="current-selection">

          <div class="current-label">
            Currently Selected
          </div>

          <div
            id="selected-name"
            class="current-value"
          >
            IN/OUT [BRONZE]
          </div>

        </div>


        <!-- FOOTER -->

        <div class="menu-footer">

          <span>
            2GOSPOTLESS
          </span>

          <span>
            PREMIUM MOBILE DETAILING
          </span>

        </div>


      </div>

    </div>


  </section>

</main>


<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script>

document.addEventListener(
  "DOMContentLoaded",
  () => {


    const image =
      document.getElementById(
        "package-image"
      );


    const selectedName =
      document.getElementById(
        "selected-name"
      );


    const packageOptions =
      document.querySelectorAll(
        ".menu-option"
      );


    function selectPackage(option) {


      const packageName =
        option.dataset.package;


      const packageNumber =
        option.dataset.number;


      const imagePath =
        option.dataset.image;


      const imageAlt =
        option.dataset.alt;


      /*
       * Update selected menu item
       */

      packageOptions.forEach(
        (item) => {

          const isSelected =
            item === option;


          item.classList.toggle(
            "is-active",
            isSelected
          );


          item.setAttribute(
            "aria-pressed",
            String(isSelected)
          );

        }
      );


      /*
       * Update current selection
       */

      selectedName.textContent =
        packageName;


      /*
       * Fade image out
       */

      image.classList.add(
        "is-changing"
      );


      /*
       * Change image after
       * short animation
       */

      window.setTimeout(
        () => {

          image.src =
            imagePath;

          image.alt =
            imageAlt;


          /*
           * Fade image back in
           */

          const showImage =
            () => {

              image.classList.remove(
                "is-changing"
              );

            };


          image.addEventListener(
            "load",
            showImage,
            {
              once: true
            }
          );


          /*
           * Prevent image staying
           * invisible if cached
           */

          if (image.complete) {

            image.classList.remove(
              "is-changing"
            );

          }

        },
        180
      );

    }


    /*
     * Click controls
     */

    packageOptions.forEach(
      (option) => {


        option.addEventListener(
          "click",
          () => {

            selectPackage(
              option
            );

          }
        );


        /*
         * Keyboard controls
         */

        option.addEventListener(
          "keydown",
          (event) => {


            if (
              event.key === "Enter" ||
              event.key === " "
            ) {

              event.preventDefault();


              selectPackage(
                option
              );

            }


            /*
             * Arrow navigation
             */

            if (
              event.key === "ArrowDown" ||
              event.key === "ArrowRight"
            ) {

              event.preventDefault();


              const currentIndex =
                Array.from(
                  packageOptions
                ).indexOf(option);


              const nextIndex =
                (currentIndex + 1) %
                packageOptions.length;


              packageOptions[
                nextIndex
              ].focus();


              selectPackage(
                packageOptions[
                  nextIndex
                ]
              );

            }


            if (
              event.key === "ArrowUp" ||
              event.key === "ArrowLeft"
            ) {

              event.preventDefault();


              const currentIndex =
                Array.from(
                  packageOptions
                ).indexOf(option);


              const previousIndex =
                (
                  currentIndex -
                  1 +
                  packageOptions.length
                ) %
                packageOptions.length;


              packageOptions[
                previousIndex
              ].focus();


              selectPackage(
                packageOptions[
                  previousIndex
                ]
              );

            }

          }
        );

      }
    );


  }
);

</script>


</body>
</html>
